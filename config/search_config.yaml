# Job search configuration for the daily dashboard.
# Edit this file any time to change what gets searched for — no code changes
# needed. It's read fresh by scripts/search_jobs.py on every run.

# Adzuna country code. gb = United Kingdom.
country: gb

# Each entry is one search query, run against Adzuna and — if REED_API_KEY
# is set — also against Reed; results from every query and source are
# merged and de-duplicated before the dashboard sees them. "what_phrase" is
# Adzuna's exact-phrase mode (tighter than a plain keyword search); Reed has
# no equivalent and always does a general keyword search on this same text.
#
# Bare seniority words ("Chief", "Director", "VP" with nothing else) were
# tried and DON'T WORK: Adzuna/Reed only return page 1 (50 results) per
# query, and on any given day that page for a word like "Director" alone is
# dominated by sales/retail/healthcare/finance roles nationally — genuine
# tech-adjacent postings exist but sit past page 1 and never get fetched at
# all, so they can't even reach the CV-keyword check below. Tested live:
# 420 raw results, 0 kept.
#
# So this list stays domain-anchored (technology/digital/engineering) to
# keep page 1 populated with roles that are AT LEAST plausibly relevant —
# but title_must_contain below is generic, not tied to any specific
# C-suite phrase, and min_keyword_matches is what actually decides
# inclusion. A role doesn't need "CIO" or "IT Director" in its title to
# make the dashboard; it needs to resonate with cv_keywords.
searches:
  - what_phrase: "Chief Information Officer"
  - what_phrase: "Chief Technology Officer"
  - what_phrase: "Chief Digital Officer"
  - what_phrase: "Group CIO"
  - what_phrase: "CIO"
  - what_phrase: "CTO"
  - what_phrase: "Head of Technology"
  - what_phrase: "Head of IT"
  - what_phrase: "Head of Digital"
  - what_phrase: "Head of Engineering"
  - what_phrase: "Technology Director"
  - what_phrase: "Digital Director"
  - what_phrase: "IT Director"
  - what_phrase: "Director of Technology"
  - what_phrase: "Director of Digital"
  - what_phrase: "Director of Engineering"
  - what_phrase: "VP Technology"
  - what_phrase: "VP Engineering"
  - what_phrase: "VP Digital"
  - what_phrase: "Vice President Technology"
  - what_phrase: "Vice President Engineering"

# Left blank deliberately: the location filter below narrows to
# commutable-from-Farnham-or-remote roles across ALL these UK-wide
# searches, without needing a separate location query per title (which
# would multiply the number of daily API calls).
where: ""

# Minimum annual salary in GBP. Jobs Adzuna reports below this are dropped.
# Set to 0 to disable. Adzuna doesn't have salary data for every listing, so
# this only filters postings that state a figure.
salary_min: 135000

# Only consider postings from the last N days. 30 covers a full month —
# jobs stay on the dashboard until they age out of this window, not just on
# the day they're first seen (the "New" badge still reflects first_seen).
max_days_old: 30

# At least one of these (case-insensitive) must appear in the job's
# title+description to make it onto the dashboard — checked against the
# same full text Adzuna already matched the search query against, so this
# doesn't re-exclude real candidates whose title just doesn't happen to
# restate the phrase (e.g. "Head of Engineering" whose description says
# "reports to the CIO"). Leave empty to disable.
#
# Deliberately generic, unlike the searches list above: this is only a
# seniority check (does the role sound senior at all?), not a relevance
# check — a role doesn't need "CIO" or "Technology Director" specifically,
# just some senior-sounding word. Relevance is cv_keywords +
# min_keyword_matches below, which is the actual "does this fit the CV" gate.
title_must_contain:
  - "head"
  - "chief"
  - "director"
  - "vp"
  - "vice president"

# Case-insensitive terms — if any appear in the job title, the job is
# dropped, regardless of title_must_contain above.
exclude_title_terms:
  - junior
  - intern
  - internship
  - assistant
  - deputy
  - trainee

# Results per query page. 50 is Adzuna's maximum.
results_per_page: 50

# Skills and domain expertise pulled from the CV (Key Skills & Expertise,
# plus recurring themes from Career Experience). A job's title+description
# is scored against this list; matched terms are shown on the dashboard as
# tags and used for "Best CV match" sorting, so results are ranked by
# substance, not just by which title-phrase query happened to surface them.
cv_keywords:
  - "Information Security"
  - "Enterprise Risk"
  - "Risk Governance"
  - "Data Protection"
  - "GDPR"
  - "ISO27001"
  - "Cyber Essentials"
  - "Security Operations Centre"
  - "SOC"
  - "Vendor Management"
  - "Third-Party Risk"
  - "Budget Management"
  - "Financial Governance"
  - "Chargeback"
  - "Showback"
  - "OPEX"
  - "CAPEX"
  - "Organisational Design"
  - "Talent Development"
  - "Succession Planning"
  - "Change Management"
  - "Digital Transformation"
  - "Cloud Transformation"
  - "Hyper-Growth"
  - "Business Continuity"
  - "SAP S/4HANA"
  - "ITSM"
  - "ITIL"
  - "Major Incident Management"
  - "Data Strategy"
  - "Board Reporting"
  - "Non-Executive Director"
  - "NED"
  - "Trustee"
  - "Federated"

# Minimum number of cv_keywords that must appear in a job's title+description
# for it to make the dashboard. 0 disables this as a hard filter — keywords
# are still scored and shown as tags, and drive "Best CV match" sorting, but
# don't gate inclusion.
#
# Set to 1: the searches list above is domain-anchored (technology/digital/
# engineering terms), so the raw candidate pool is already tech-adjacent,
# not cross-industry noise — title_must_contain being generic doesn't
# reintroduce that risk the way bare "Chief"/"Director" searches did. This
# is still the real relevance gate (a role need not say "CIO" to be kept,
# but it must resonate with cv_keywords somewhere), just doesn't need to be
# as strict as it would with a noisier raw pool. Adzuna descriptions are
# short/truncated, so keep this low — raise it only if irrelevant roles
# start showing up; lower toward 0 if it's cutting real matches.
min_keyword_matches: 1

# A job must be based in one of commutable_areas (case-insensitive
# substring match against its location) OR mention one of remote_terms
# (in its location, title or description) to make the dashboard — this is
# what implements "commutable from Farnham, or remote". Edit these lists
# to widen/narrow the geography.
location:
  commutable_areas:
    - Farnham
    - Guildford
    - Aldershot
    - Farnborough
    - Fleet
    - Camberley
    - Woking
    - Bagshot
    - Frimley
    - Haslemere
    - Godalming
    - Alton
    - Basingstoke
    - Winchester
    - Reading
    - Didcot
    - Oxford
    - Bracknell
    - Staines
    - Weybridge
    - Epsom
    - Kingston
    - Richmond
    - Wimbledon
    - Sutton
    - Surrey
    - Hampshire
    - London
    - "Greater London"
    - "South East"
  remote_terms:
    - remote
    - "work from home"
    - wfh
    - hybrid
    - "uk wide"
    - nationwide
