name: Daily Job Search

on:
  schedule:
    # ~07:00 UTC daily. Deliberately NOT exactly on the hour: GitHub's own
    # docs warn that scheduled workflows can be delayed (or effectively
    # dropped) during high-load periods, and "the start of every hour" is
    # named as the worst offender. :17 avoids that contention.
    # Scheduled workflows only fire on the repo's default branch, so this
    # activates once this workflow reaches that branch.
    - cron: "17 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Runs one at a time. Without this, two overlapping runs (e.g. the daily
# schedule firing while someone manually re-runs the workflow) can both
# check out the same starting commit, and whichever pushes second gets a
# non-fast-forward rejection. Queue instead of racing.
concurrency:
  group: job-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job search
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          # Optional: Reed is skipped (Adzuna-only) if this secret isn't set.
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
        run: python scripts/search_jobs.py

      - name: Commit updated results
        run: |
          git config user.name "job-search-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update job listings ($(date -u +%Y-%m-%d))"

          # The concurrency group above should make this impossible in
          # normal operation, but as a fallback: data/jobs.json is fully
          # regenerated every run (it always carries a fresh timestamp), so
          # if something else already pushed an update, rebasing would just
          # hit a content conflict on that same file for no benefit. Standing
          # down and deferring to whatever's already on the remote is
          # correct here — this run's snapshot is redundant, not lost.
          if ! git push; then
            echo "Push rejected — another run already published an update. Standing down."
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
          fi
